<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <script>window.process = {env: {NODE_ENV: 'production'}};</script>
  <script type="importmap">
    {
      "scopes": {
        "./custom/build/": {
          "@haxtheweb/": "./build/es6/node_modules/@haxtheweb/",
          "lit": "./build/es6/node_modules/lit/index.js",
          "lit/": "./build/es6/node_modules/lit/",
          "mobx": "./build/es6/node_modules/mobx/dist/mobx.esm.js"
        }
      }
    }
  </script>
</head>
<body>
<pre id="result">Starting navigation test...</pre>
<script type="module">
  const log = (msg) => {
    document.getElementById('result').textContent += '\n' + msg;
    console.log('[NAVTEST]', msg);
  };

  // Wait for the site to load
  log('Waiting for haxcms-ready...');
  globalThis.addEventListener('haxcms-ready', async () => {
    log('haxcms-ready fired');
    await new Promise(r => setTimeout(r, 2000));

    // Check initial state
    const theme = document.querySelector('odl-haxtheme');
    if (!theme) { log('FAIL: no odl-haxtheme found'); return; }
    log('Theme found. _activeTemplate: ' + theme._activeTemplate);
    log('Theme shadowChildren: ' + (theme.shadowRoot ? theme.shadowRoot.childElementCount : 0));
    const contentPage = theme.shadowRoot && theme.shadowRoot.querySelector('#content-page');
    log('content-page tag: ' + (contentPage ? contentPage.tagName : 'none'));

    // Check store state
    const store = globalThis.HAXCMS.requestAvailability().store;
    log('store.location: ' + JSON.stringify(store.location?.route));
    log('store.activeId: ' + store.activeId);

    // Navigate to /news via pushState + popstate
    log('\nNavigating to /news...');
    globalThis.history.pushState({}, '', '/news');
    globalThis.dispatchEvent(new PopStateEvent('popstate'));

    // Wait for navigation to process
    await new Promise(r => setTimeout(r, 3000));

    // Check state after navigation
    log('\nAfter navigation to /news:');
    log('URL: ' + globalThis.location.pathname);
    log('store.location: ' + JSON.stringify(store.location?.route));
    log('store.activeId: ' + store.activeId);
    log('store.activeItem: ' + JSON.stringify(store.activeItem?.id));
    log('theme._activeTemplate: ' + theme._activeTemplate);
    const cp2 = theme.shadowRoot && theme.shadowRoot.querySelector('#content-page');
    log('content-page tag: ' + (cp2 ? cp2.tagName : 'none'));
    log('theme.childNodes (light DOM): ' + theme.childNodes.length);
    if (theme.childNodes.length > 0) {
      log('first light DOM child: ' + theme.childNodes[0].tagName + ' / ' + (theme.childNodes[0].textContent || '').substring(0, 100));
    }

    // Try navigating to a blog post
    log('\nNavigating to /blog-posts/9-2-21...');
    globalThis.history.pushState({}, '', '/blog-posts/9-2-21');
    globalThis.dispatchEvent(new PopStateEvent('popstate'));
    await new Promise(r => setTimeout(r, 3000));

    log('\nAfter navigation to /blog-posts/9-2-21:');
    log('URL: ' + globalThis.location.pathname);
    log('store.location: ' + JSON.stringify(store.location?.route));
    log('store.activeId: ' + store.activeId);
    log('theme._activeTemplate: ' + theme._activeTemplate);
    const cp3 = theme.shadowRoot && theme.shadowRoot.querySelector('#content-page');
    log('content-page tag: ' + (cp3 ? cp3.tagName : 'none'));
    log('theme.childNodes: ' + theme.childNodes.length);
    if (theme.childNodes.length > 0) {
      log('first child: ' + theme.childNodes[0].tagName);
    }
    log('\nDONE');
  });
</script>
</body>
</html>
